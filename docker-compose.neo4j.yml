services:
  neo4j:
    image: neo4j:5.26.28
    container_name: llmgraph-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u '${NEO4J_USERNAME}' -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
